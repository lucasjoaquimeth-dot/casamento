<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayane &amp; Lucas — 18.10.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        #5a7d9f 0%,
        #6b8ba8 20%,
        #8b9fb8 35%,
        #a0a895 50%,
        #b8a788 65%,
        #9d8e75 85%,
        #8b7d6b 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        #5a7d9f 0%,
        #6b8ba8 20%,
        #8b9fb8 35%,
        #a0a895 50%,
        #b8a788 65%,
        #9d8e75 85%,
        #8b7d6b 100%
      );
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(480px, 56.25dvh, 100vw);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 8px 60px rgba(0, 0, 0, 0.7);
    }

    .card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      z-index: 1;
    }

    .seal-link {
      position: absolute;
      left: 50%;
      top: 33%;
      transform: translate(-50%, -50%);
      width: clamp(160px, 46cqw, 260px);
      padding: clamp(14px, 3.5cqw, 22px) clamp(20px, 5cqw, 36px);
      border-radius: 60px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 10;
      background: rgba(255, 248, 220, 0.88);
      border: 2px solid rgba(212, 175, 55, 0.85);
      box-shadow:
        0 6px 28px rgba(0, 0, 0, 0.35),
        0 0 0 4px rgba(212, 175, 55, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: sealPulse 3s ease-in-out infinite;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1),
                  box-shadow 0.3s ease,
                  background 0.3s ease;
    }

    .seal-link:hover,
    .seal-link:focus-visible {
      transform: translate(-50%, -50%) scale(1.06);
      background: rgba(255, 248, 220, 0.97);
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.4),
        0 0 0 5px rgba(212, 175, 55, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      animation-play-state: paused;
      outline: none;
    }

    .seal-hint {
      white-space: nowrap;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(16px, 4cqw, 24px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #4a3510;
      pointer-events: none;
    }

    .seal-arrow {
      font-size: clamp(18px, 4.5cqw, 26px);
      color: rgba(160, 110, 20, 0.85);
      pointer-events: none;
      animation: arrowBounce 1.4s ease-in-out infinite;
      line-height: 1;
    }

    @keyframes sealPulse {
      0%, 100% {
        box-shadow:
          0 6px 28px rgba(0,0,0,.35),
          0 0 0 4px rgba(212,175,55,.18),
          inset 0 1px 0 rgba(255,255,255,.6);
      }
      50% {
        box-shadow:
          0 6px 28px rgba(0,0,0,.35),
          0 0 0 8px rgba(212,175,55,.30),
          0 0 30px rgba(212,175,55,.25),
          inset 0 1px 0 rgba(255,255,255,.6);
      }
    }

    @keyframes arrowBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(4px); }
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 110% 100% at 50% 50%,
        transparent 55%,
        rgba(10, 8, 5, 0.32) 100%
      );
      pointer-events: none;
      z-index: 6;
    }

    .card { container-type: inline-size; }

    @media (max-width: 768px) {
      .card {
        width: min(calc(100vw - 16px), 480px);
        aspect-ratio: 9 / 16;
      }

      .seal-link {
        width: clamp(180px, 50cqw, 280px);
        padding: 16px 28px;
        top: 10%;
      }

      .seal-hint {
        font-size: clamp(18px, 4.5cqw, 26px);
      }

      .seal-arrow {
        font-size: clamp(20px, 5cqw, 28px);
      }
    }

    @media (max-width: 480px) {
      .card {
        width: 100vw;
        aspect-ratio: 9 / 16;
        border-radius: 2px;
      }

      .seal-link {
        width: clamp(200px, 55cqw, 300px);
        padding: 18px 32px;
        top: 10%;
      }

      .seal-hint {
        font-size: clamp(20px, 5.5cqw, 28px);
      }

      .seal-arrow {
        font-size: clamp(22px, 6cqw, 30px);
      }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- 1 ── IMAGEM ÚNICA: preenche o card inteiro -->
  <img
    class="card-img"
    src="../assets/venue/carta_versao_final.png"
    alt="Carta de convite - Mayane &amp; Lucas"
    draggable="false"
  >

  <!-- 3 ── SELO CLICÁVEL: sobre o lacre dourado do envelope -->
  <a
    class="seal-link"
    href="../convite/index.html"
    aria-label="Abrir convite de casamento de Mayane e Lucas"
  >
    <span class="seal-hint">Clique para abrir</span>
  </a>

  <!-- 4 ── VINHETA lateral -->
  <div class="vignette" aria-hidden="true"></div>

</div>

</body>
</html>
