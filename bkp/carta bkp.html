<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayane &amp; Lucas — 18.10.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      /* Fundo em gradiente vertical seguindo as divisões da carta */
      background: linear-gradient(
        to bottom,
        #5a7d9f 0%,        /* Azul do envelope - topo */
        #6b8ba8 20%,       /* Azul mais claro */
        #8b9fb8 35%,       /* Azul mais claro ainda */
        #a0a895 50%,       /* Transição para bege */
        #b8a788 65%,       /* Bege/terra da foto */
        #9d8e75 85%,       /* Bege mais escuro */
        #8b7d6b 100%       /* Base mais escura */
      );
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Fundo desfocado que preenche as laterais */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        #5a7d9f 0%,
        #6b8ba8 20%,
        #8b9fb8 35%,
        #a0a895 50%,
        #b8a788 65%,
        #9d8e75 85%,
        #8b7d6b 100%
      );
      z-index: 0;
    }

    /* ════════════════════════════════════════════
       CARD — proporção 9:16, centralizado na tela
       Layout vertical (retrato)
    ════════════════════════════════════════════ */
    .card {
      position: relative;
      z-index: 1;
      /* Cabe na tela: cresce até 480px de largura ou até caber em altura */
      width: min(480px, 56.25dvh, 100vw);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 8px 60px rgba(0, 0, 0, 0.7);
    }

    /* ════════════════════════════════════════════
       ENVELOPE — ocupa 40% do topo do card
       Com a imagem horizontal redimensionada
    ════════════════════════════════════════════ */
    .envelope-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40%;
      overflow: hidden;
      z-index: 2;
    }

    .envelope-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      /* Fade forte no topo: de transparente para a cor do envelope */
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,0.6) 8%,
        rgba(0,0,0,0.92) 16%,
        #000 24%,
        #000 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,0.6) 8%,
        rgba(0,0,0,0.92) 16%,
        #000 24%,
        #000 100%
      );
    }

    /* Overlay de cor que preenche o meio (entre as duas imagens) */
    .envelope-fade {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(
        to bottom,
        transparent 55%,
        rgba(143, 174, 200, 0.08) 65%,
        rgba(143, 174, 200, 0.15) 75%,
        rgba(143, 174, 200, 0.12) 85%,
        rgba(143, 174, 200, 0.05) 100%
      );
      pointer-events: none;
      z-index: 3;
    }

    /* ════════════════════════════════════════════
       FOTO DOS NOIVOS — preenche os 60% inferiores
    ════════════════════════════════════════════ */
    .photo-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      z-index: 1;
      overflow: hidden;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center bottom;
      filter: saturate(0.92) brightness(0.85);
    }

    /* Fade no topo da foto: começa em #8faec8 e dissolve para a foto */
    .photo-wrap::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 30%;
      background: linear-gradient(
        to bottom,
        rgba(143, 174, 200, 0.04) 0%,
        rgba(143, 174, 200, 0.02) 50%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* ════════════════════════════════════════════
       SELO CLICÁVEL — sobre o lacre dourado
       O lacre fica na parte superior do card,
       aproximadamente a 30% da altura total
    ════════════════════════════════════════════ */
    .seal-link {
      position: absolute;
      left: 50%;
      /* Lacre fica em ~28% da altura do card (no envelope) */
      top: 28%;
      transform: translate(-50%, -50%);
      /* Tamanho proporcional à largura do card */
      width: clamp(36px, 14cqw, 88px);
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: sealPulse 3s ease-in-out infinite;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), filter 0.3s;
    }

    .seal-link:hover,
    .seal-link:focus-visible {
      transform: translate(-50%, -50%) scale(1.1);
      filter: brightness(1.2) drop-shadow(0 0 22px rgba(210, 170, 60, 0.8));
      animation-play-state: paused;
      outline: none;
    }

    .seal-hint {
      position: absolute;
      bottom: -clamp(18px, 5cqw, 26px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(8px, 2.2cqw, 12px);
      letter-spacing: 0.22em;
      color: rgba(220, 195, 120, 0.95);
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .seal-link:hover .seal-hint,
    .seal-link:focus-visible .seal-hint {
      opacity: 1;
    }

    @keyframes sealPulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(210, 170, 60, 0.3)); }
      50%       { filter: drop-shadow(0 0 18px rgba(210, 170, 60, 0.65)); }
    }

    /* Vinheta lateral suave */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 110% 100% at 50% 50%,
        transparent 55%,
        rgba(10, 8, 5, 0.32) 100%
      );
      pointer-events: none;
      z-index: 6;
    }

    /* container-query para cqw funcionar */
    .card { container-type: inline-size; }

    /* ════════════════════════════════════════════
       RESPONSIVIDADE MOBILE
    ════════════════════════════════════════════ */
    @media (max-width: 768px) {
      /* Em telas pequenas, o card se adapta melhor */
      .card {
        width: min(calc(100vw - 16px), 480px);
        aspect-ratio: 9 / 16;
      }

      .seal-link {
        width: clamp(32px, 12cqw, 80px);
        top: 28%;
      }
    }

    /* Em telas muito pequenas (mobile) */
    @media (max-width: 480px) {
      .card {
        width: calc(100vw - 12px);
        aspect-ratio: 9 / 16;
        border-radius: 2px;
      }

      .seal-link {
        width: clamp(28px, 10cqw, 64px);
        top: 28%;
      }

      .seal-hint {
        bottom: -clamp(16px, 4.5cqw, 22px);
        font-size: clamp(7px, 1.8cqw, 10px);
      }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- 1 ── ENVELOPE: só o topo é visível (aba + lacre) -->
  <div class="envelope-wrap">
    <img
      class="envelope-img"
      src="assets/venue/carta_horizontal.png"
      alt="Envelope de convite Mayane &amp; Lucas"
      draggable="false"
    >
  </div>

  <!-- 1b ── FADE de cor sobre a base do envelope -->
  <div class="envelope-fade" aria-hidden="true"></div>

  <!-- 2 ── FOTO DOS NOIVOS: preenche a parte inferior -->
  <div class="photo-wrap">
    <img
      class="photo-img"
      src="assets/photos/IMG_5311.JPEG"
      alt="Mayane e Lucas"
      draggable="false"
    >
  </div>

  <!-- 3 ── SELO CLICÁVEL: sobre o lacre dourado do envelope -->
  <a
    class="seal-link"
    href="convite/index.html"
    aria-label="Abrir convite de casamento de Mayane e Lucas"
  >
    <span class="seal-hint">abrir convite</span>
  </a>

  <!-- 4 ── VINHETA lateral -->
  <div class="vignette" aria-hidden="true"></div>

</div>

</body>
</html>
